{{- $pw := include "tailscale.adminPassword" . }}
{{- $user := include "tailscale.basicAuthUsername" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tailscale.secretName" . }}
  labels:
    {{- include "tailscale.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Platform credential (has_admin_gui, helm_secret carrier): basic-auth password of
  # the entrance. Explicit (platform) > live Secret > generated once.
  admin_password: {{ $pw | quote }}
  # The username in effect (entrance.basicAuthUsername, or admin when invalid).
  admin_username: {{ $user | quote }}
  # nginx basic-auth file, mounted as a Secret VOLUME (not subPath): the kubelet swaps
  # it in place when the Secret changes and nginx reads auth_basic_user_file on every
  # request, so neither the username nor the password is part of the pod template
  # (the platform's reset is `helm upgrade --atomic --timeout 15s` first, then the
  # operator's rollout restart). {PLAIN}: the password is already plaintext in this
  # Secret and no bcrypt salt churns on upgrade. The username is validated
  # (tailscale.basicAuthUsername); CR/LF stripped from the password so it cannot
  # inject a second htpasswd line.
  htpasswd: {{ printf "%s:{PLAIN}%s\n" $user ($pw | replace "\r" "" | replace "\n" "") | quote }}
  # Printed by the entrance container at start ("" = nothing to report), e.g. an
  # invalid entrance.basicAuthUsername that fell back to admin. ALWAYS rendered.
  entrance_notice: {{ include "tailscale.entranceNotice" . | quote }}
  # The tenant's auth key (tailscale.authKey). ALWAYS rendered, empty when unset:
  # dropping a stringData key on upgrade does not delete the old data key (EMQX 0.1.2
  # lesson), so writing "" is what actually clears it. Read by the entrypoint only
  # while the node needs a login.
  authkey: {{ include "tailscale.authKey" . | quote }}
