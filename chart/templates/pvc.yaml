{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
{{/*
Node identity (tailscaled.state: machine + node keys, prefs, serve config).
Chart-owned, NOT a volumeClaimTemplate, so the platform's PVC retention / orphan
handling applies. Losing it = a new machine on the tenant's tailnet.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "tailscale.pvcName" . }}
  labels:
    {{- include "tailscale.labels" . | nindent 4 }}
spec:
  accessModes: {{ .Values.persistence.accessModes | toYaml | nindent 4 }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ include "tailscale.stateSize" . | quote }}
{{- end }}
